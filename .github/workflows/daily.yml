name: Phillies Daily Update

on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: phillies-daily
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is noon in Philadelphia (skip on schedule if not noon)
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" != "12" ]; then
            echo "Not noon ET (hour=$HOUR), exiting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's page
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_update.py

      - name: Publish to GitHub Pages branch
        run: |
          git config user.name "phillies-daily-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Daily update $(TZ=America/New_York date +%Y-%m-%d)" || echo "No changes"
          git push

      - name: Send the noon text
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python send_sms.py
